<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金庸群俠傳</title>
<meta name="description" content="開放式武俠角色扮演：十四部秘笈，方格戰棋，江湖任你行。">
<style>
:root{
  --paper:#e9e1d0; --paper2:#f4eee1; --panel:#f6f1e6; --line:#c6b89b;
  --ink:#241f19; --ink2:#5b5145; --ink3:#8a7c68;
  --red:#9c2b23; --red2:#c0392b; --gold:#8a6d3b; --jade:#3d6b57;
  --hp:#a8322a; --mp:#2f5d8a; --sta:#7a6a2f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(0,0,0,.05) 0 38%, transparent 39%),
    radial-gradient(circle at 82% 78%, rgba(0,0,0,.04) 0 42%, transparent 43%);
  color:var(--ink);
  font-family:"Noto Serif TC","Songti TC","STSong","PMingLiU",serif;
  font-size:15px; line-height:1.7;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column}

/* ── 通用 ── */
.btn{
  background:var(--paper2);border:1px solid var(--line);border-radius:2px;
  padding:.42em .9em;transition:.12s;white-space:nowrap;
}
.btn:hover:not(:disabled){background:#fff;border-color:var(--ink3)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--red);color:#f6efe2;border-color:#7d211b}
.btn.primary:hover:not(:disabled){background:var(--red2)}
.btn.sm{padding:.22em .6em;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--ink3)}
.small{font-size:13px}
.tiny{font-size:12px}
.seal{
  display:inline-block;background:var(--red);color:#f6efe2;padding:0 .35em;
  border-radius:2px;font-size:12px;letter-spacing:.08em;
}
h1,h2,h3{font-weight:600;letter-spacing:.06em}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* ── 標題畫面 ── */
#title{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;z-index:60;
  background:linear-gradient(160deg,#efe7d6,#ddd2ba);
}
#title .big{
  font-size:clamp(38px,9vw,76px);letter-spacing:.3em;text-indent:.3em;
  color:var(--ink);text-shadow:2px 3px 0 rgba(156,43,35,.16);
}
#title .sub{color:var(--ink2);letter-spacing:.5em;text-indent:.5em}
#title .menu{display:flex;flex-direction:column;gap:9px;min-width:270px;margin-top:6px}
#title .credit{position:absolute;bottom:14px;font-size:12px;color:var(--ink3)}
.slot{display:flex;justify-content:space-between;gap:10px;align-items:center}

/* ── 主畫面框架 ── */
#hud{
  display:flex;gap:14px;align-items:center;padding:6px 12px;
  border-bottom:1px solid var(--line);background:var(--panel);
  font-size:13px;flex-wrap:wrap;flex:0 0 auto;
}
#hud b{font-weight:600}
#main{flex:1;display:flex;min-height:0}
#left{flex:1.35;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
#right{flex:1;min-width:0;max-width:460px;display:flex;flex-direction:column;background:var(--panel)}
#stage{flex:1;position:relative;min-height:0;background:#e5dcc7}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#side{flex:1;overflow-y:auto;padding:12px 14px}
#logbox{
  flex:0 0 clamp(84px,16vh,150px);overflow-y:auto;padding:8px 14px;
  border-top:1px solid var(--line);font-size:13px;color:var(--ink2);background:#efe8da;
}
#logbox div{margin:1px 0}
#logbox div:last-child{color:var(--ink)}
#actions{padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);flex:0 0 auto}

/* ── 地點資訊 ── */
.loc-name{font-size:22px;letter-spacing:.12em}
.loc-desc{color:var(--ink2);margin:6px 0 10px;font-size:14px}
.chip{
  display:inline-block;border:1px solid var(--line);border-radius:2px;
  padding:.1em .5em;font-size:12px;background:var(--paper2);margin:0 4px 4px 0;
}
.chip.on{background:var(--jade);color:#f2ede1;border-color:var(--jade)}
.chip.off{color:var(--ink3)}

/* ── 人物卡 ── */
.pc{border:1px solid var(--line);background:var(--paper2);padding:8px 10px;margin-bottom:8px;border-radius:2px}
.pc.sel{border-color:var(--red);box-shadow:inset 0 0 0 1px rgba(156,43,35,.3)}
.pc .nm{display:flex;gap:8px;align-items:baseline}
.pc .nm b{font-size:16px}
.bar{height:7px;background:#d8cdb4;border-radius:1px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%}
.bar.hp i{background:var(--hp)} .bar.mp i{background:var(--mp)} .bar.sta i{background:var(--sta)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:2px 10px;font-size:13px}
.statgrid span{color:var(--ink3)}

/* ── 清單 ── */
.list{display:flex;flex-direction:column;gap:5px}
.item{
  display:flex;gap:8px;align-items:center;border:1px solid var(--line);
  background:var(--paper2);padding:6px 9px;border-radius:2px;text-align:left;width:100%;
}
.item:hover:not(:disabled){background:#fff}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600}
.item .d{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 對話框 ── */
/* 必須高於 #title 的 z-index:60，否則標題畫面會蓋住對話框，按了沒反應 */
#modal{position:absolute;inset:0;background:rgba(30,26,20,.55);display:none;z-index:100;
  align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.dlg{
  background:var(--panel);border:1px solid var(--gold);border-radius:3px;
  max-width:min(640px,94vw);width:100%;max-height:88dvh;display:flex;flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}
.dlg h3{padding:10px 16px;border-bottom:1px solid var(--line);letter-spacing:.14em;font-size:17px}
.dlg .body{padding:14px 16px;overflow-y:auto;flex:1}
.dlg .foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:4px;padding:8px 16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-bottom:none;background:#e6ddc9;padding:.25em .8em;
  border-radius:3px 3px 0 0;font-size:14px}
.tab.on{background:var(--panel);color:var(--red);font-weight:600}

/* ── 戰鬥 ── */
#bhud{display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.turnpill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);
  background:var(--paper2);padding:.1em .5em;border-radius:2px;font-size:12px}
.turnpill.ally{border-color:#2f5d8a}
.turnpill.enemy{border-color:var(--red)}
.turnpill.now{background:var(--gold);color:#f6efe2;border-color:var(--gold)}
#skilllist .item.no{opacity:.4}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:1px 0}
.narr{
  background:#efe8da;border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;
  font-size:14px;color:var(--ink2);white-space:pre-wrap;
}
.fx{position:absolute;pointer-events:none;font-weight:600;font-size:17px;
  text-shadow:0 1px 2px rgba(255,255,255,.85);transition:transform .7s ease-out,opacity .7s ease-out}

@media(max-width:820px){
  #main{flex-direction:column}
  #left{flex:1.1;border-right:none;border-bottom:1px solid var(--line)}
  #right{flex:1;max-width:none}
  #logbox{flex-basis:clamp(60px,12vh,110px)}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
