<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>金庸群俠傳 — 第一人稱．只靠走的江湖</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0d1420;height:100%;
    font-family:"Songti TC","Noto Serif TC","PingFang TC",-apple-system,serif;}
  canvas{display:block;touch-action:none;}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 46%, transparent 56%, rgba(8,12,20,.46) 100%);}
  .hud{position:fixed;z-index:10;color:#eae2d2;pointer-events:none;
    text-shadow:0 2px 12px rgba(0,0,0,.75);}
  #title{top:20px;left:24px;transition:opacity 2.5s;}
  #title h1{margin:0;font-size:21px;font-weight:400;letter-spacing:9px;}
  #title p{margin:5px 0 0;font-size:11px;opacity:.62;letter-spacing:4px;}
  #place{bottom:26px;left:24px;font-size:27px;font-weight:400;letter-spacing:5px;}
  #meta{bottom:26px;right:24px;text-align:right;font-size:12px;opacity:.62;
    letter-spacing:2px;line-height:1.95;font-family:-apple-system,Arial,sans-serif;}
  #mini{position:fixed;right:22px;top:20px;z-index:11;width:170px;height:170px;
    border-radius:50%;pointer-events:none;
    filter:drop-shadow(0 6px 22px rgba(0,0,0,.5));}
  #mount{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:11;
    color:#f2e6c8;font-size:13px;letter-spacing:3px;opacity:.82;pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,.7);}
  #compass{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;
    color:#eae2d2;font-size:15px;letter-spacing:8px;opacity:.68;pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,.7);}
  #compass::before,#compass::after{content:"—";opacity:.35;padding:0 12px;}
  #hint{top:78px;left:24px;font-size:11px;opacity:.55;letter-spacing:1px;line-height:2;
    font-family:-apple-system,Arial,sans-serif;transition:opacity .6s;}
  #toast{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);z-index:14;
    color:#f2e9d8;font-size:22px;font-weight:400;letter-spacing:7px;padding:12px 34px;
    border:1px solid rgba(230,214,180,.32);background:rgba(14,18,26,.5);
    backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .5s;
    text-shadow:0 2px 10px rgba(0,0,0,.7);white-space:nowrap;}
  #crosshair{position:fixed;top:50%;left:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
    background:rgba(240,232,214,.42);border-radius:50%;z-index:9;pointer-events:none;}
  #overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;transition:opacity .7s;color:#eae2d2;
    background:linear-gradient(170deg, rgba(12,20,34,.93), rgba(28,26,24,.95));backdrop-filter:blur(7px);}
  #overlay h1{font-size:46px;font-weight:400;letter-spacing:18px;margin:0 0 10px;
    background:linear-gradient(100deg,#e8dcc0,#c9a86a,#8fb4c8);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  #overlay h2{font-size:13px;font-weight:400;letter-spacing:7px;opacity:.7;margin:0 0 8px;}
  #overlay .lede{font-size:13px;opacity:.66;letter-spacing:2px;line-height:2.1;
    text-align:center;margin:22px 0 30px;max-width:30em;padding:0 24px;}
  #startBtn{font-size:15px;letter-spacing:9px;padding:14px 50px;cursor:pointer;
    border:1px solid rgba(230,214,180,.46);background:rgba(200,168,106,.10);
    color:#eae2d2;transition:all .3s;font-family:inherit;}
  #startBtn:hover{background:rgba(200,168,106,.26);border-color:#c9a86a;
    box-shadow:0 0 34px rgba(200,168,106,.28);}
  body.touch #hint{display:none;}
  body.touch #place{font-size:19px;bottom:calc(18px + env(safe-area-inset-bottom));left:16px;}
  body.touch #meta{font-size:10px;bottom:calc(18px + env(safe-area-inset-bottom));right:16px;}
  body.touch #title h1{font-size:15px;letter-spacing:5px;}
  body.touch #title{top:12px;left:16px;}
  body.touch #mini{width:112px;height:112px;top:14px;right:14px;}
  body.touch #mount{bottom:calc(74px + env(safe-area-inset-bottom));font-size:11px;
    pointer-events:auto;padding:9px 18px;border:1px solid rgba(242,230,200,.32);
    border-radius:20px;background:rgba(20,16,12,.42);-webkit-tap-highlight-color:transparent;}
  body.touch #mount:empty{display:none;}
  @media (max-width:620px){
    #overlay h1{font-size:29px;letter-spacing:11px;}
    #overlay h2{font-size:10px;letter-spacing:4px;}
    #overlay .lede{font-size:11.5px;margin:16px 0 24px;}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="vignette"></div>
<div id="crosshair"></div>
<canvas id="mini" width="340" height="340"></canvas>
<div id="mount"></div>
<div id="compass">北</div>
<div class="hud" id="title"><h1>金庸群俠傳</h1><p>第一人稱．只靠走的江湖</p></div>
<div class="hud" id="hint">
  W A S D／方向鍵 — 走&nbsp;&nbsp;·&nbsp;&nbsp;滑鼠 — 看向<br>
  ← → 或 Q E — 轉身&nbsp;&nbsp;·&nbsp;&nbsp;F — 喚馬／下馬（隨處呼哨，馬立到）<br>
  M — 小地圖指北／朝向在上&nbsp;&nbsp;·&nbsp;&nbsp;[ ] — 縮放&nbsp;&nbsp;·&nbsp;&nbsp;N — 推時辰&nbsp;&nbsp;·&nbsp;&nbsp;H — 收提示<br>
  馬只走官道與平地。華山的石階，得自己爬上去。
</div>
<div class="hud" id="place"></div>
<div class="hud" id="meta">
  <div id="clock"></div><div id="alt"></div><div id="pace"></div>
</div>
<div id="toast"></div>
<div id="overlay">
  <h1>金庸群俠傳</h1>
  <h2>第一人稱．只靠走的江湖</h2>
  <div class="lede">
    你在揚州城外的官道上醒來。<br>
    十五處城鎮山門散在一張七百六十八公尺見方的圖上，<br>
    最西是光明頂，最東是桃花島，而全圖最高的那一點是華山之巔。<br>
    隨處呼哨喚馬，官道上放得開；<br>
    但華山的石階馬上不去——最後那段爬升，只能靠自己的兩條腿。
  </div>
  <button id="startBtn">入江湖</button>
</div>
<script type="module">
import { runWalk } from './engine.js?v=3d2';
import { CITY } from './cities/jianghu.js?v=3d2';
runWalk(CITY);
if (new URLSearchParams(location.search).has('autotest')) import('./tools/uitest.js?v=3d2');
</script>
</body>
</html>
